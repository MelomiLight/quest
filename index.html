<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Квест</title>
  <meta name="description" content="Геймификация жизни на пути к Middle Backend">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Квест">

  <meta name="theme-color" content="#0b0a12" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">

<body>
  <div id="app">

    </nav>
  </div>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
  <div id="achpop" hidden></div>
  <div id="levelup" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
